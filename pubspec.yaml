name: trosa
description: Application natao handraisana naoty ireo trosa tokony haloa sy mila takiana.
publish_to: 'none'
version: 1.0.8+18

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # 12.0.0-beta.3+ fixes Android registration with AGP 9 + android.builtInKotlin=false.
  file_picker: ^12.0.0-beta.7
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  intl: ^0.20.2
  # 10.x supports Flutter's built-in Kotlin (needs win32 ^6); API unchanged for us.
  package_info_plus: ^10.2.1
  path: ^1.9.1
  provider: ^6.1.5
  # 13.x supports Flutter's built-in Kotlin (needs win32 ^6); same modern API.
  share_plus: ^13.3.0
  sqflite: ^2.4.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2

dependency_overrides:
  # path_provider_platform_interface pulls in the legacy 'platform' package,
  # whose old version references an API removed from Dart 3.12+.
  platform: ^3.1.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/main_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
